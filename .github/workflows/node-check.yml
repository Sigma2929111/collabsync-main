name: Node syntax checks

on:
  push:
    branches: [development/release-v2]
  pull_request:
    branches: [development/release-v2]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - run: npm run check
      - run: npm test
